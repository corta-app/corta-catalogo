# Revisión automática de cada pull request y cambio: los efectos y las plantillas son solo datos válidos y los índices están al día.
# Corre con «pull_request» (nunca «pull_request_target»): el código de un aporte corre sin secretos y con permiso de solo lectura.
name: Revisar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  datos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Solo archivos de datos (JSON) en efectos/ y plantillas/
        run: |
          raros=$(git ls-files efectos plantillas | grep -v '\.json$' || true)
          [ -z "$raros" ] || { echo "Archivos que no son JSON: $raros"; exit 1; }
      - name: Validar los efectos y las plantillas y revisar que los índices estén al día
        run: |
          python3 herramientas/generar_indice.py
          git diff --exit-code -- efectos/index.json plantillas/index.json || { echo "Corre python3 herramientas/generar_indice.py y sube los índices."; exit 1; }
